# 의존성 취약점/업데이트 알림 — 보안 하드닝 체크리스트의 "의존성 취약점 스캔" 항목.
# PR 폭탄을 막으려고 주 1회 + 패키지별로 묶음(보안 업데이트는 주기와 무관하게 바로 옴).
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Expo SDK에 묶인 네이티브 패키지는 SDK 업그레이드 때 `expo install`로 한꺼번에 올려야 함 —
    # 개별 메이저 업데이트 PR은 무시
    ignore:
      - dependency-name: 'expo*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@sentry/react-native'
        update-types: ['version-update:semver-major']
    groups:
      app-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
