name: CI

# GitHub Actions 무료 시간(개인 계정 private 저장소 합산 월 2,000분)을 아끼려고 작업 브랜치 push에는
# 돌리지 않음 — main에 올릴 때(PR/merge)만 자동 실행, 작업 브랜치는 Actions 탭에서 수동 실행 가능.
# 작업 브랜치에선 커밋 전 로컬 검사(CLAUDE.md "세션 환경")가 사실상 유일한 안전망이니 꼭 돌릴 것.
# 문서만 바뀐 변경도 건너뜀.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # 마이그레이션 SQL을 손으로 쓰는 경우가 많아서(원격 세션엔 DB가 없음), 빈 Postgres에 전부 적용한 뒤
  # 실제 DB 구조가 schema.prisma와 한 글자도 안 어긋나는지 + 시드가 끝까지 도는지 확인함.
  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toffee
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/toffee?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Check migrations match schema.prisma (no drift)
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run db:seed

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # expo-env.d.ts는 gitignore 대상(expo start 때 자동 생성) — 없으면 CSS 모듈 타입을 못 찾아 tsc가 실패함
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npx tsc --noEmit
      - run: npx eslint src
      # 앱 단위 테스트(순수 로직, 2026-09-29) — 화면 끝-끝 테스트(npm run e2e)는 서버를 띄워야 해서 로컬에서
      - run: npm test
